<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheBurger</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #fff5e6;
      text-align: center;
    }

    header {
      background: #ff4d2e;
      color: white;
      padding: 20px;
      font-size: 24px;
    }

    .container {
      padding: 40px;
    }

    .btn {
      background: #ff4d2e;
      color: white;
      padding: 12px 20px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .btn:hover {
      background: #e63e1f;
    }
  </style>
</head>

<body>

  <header>
    🍔 TheBurger
  </header>

  <div class="container">
    <h1>Welcome to TheBurger</h1>
    <p>Fresh burgers made fast and tasty 🍟</p>

    <button class="btn">Order Now</button>
  </div>

</body>
</html>
