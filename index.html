<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TheBurger</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      margin: 0;
      background: #fff3e0;
      text-align: center;
    }

    header {
      background: #ff3d2e;
      color: white;
      padding: 20px;
      font-size: 26px;
      font-weight: bold;
    }

    .container {
      padding: 30px;
    }

    .menu {
      display: flex;
      flex-direction: column;
      gap: 15px;
      max-width: 300px;
      margin: auto;
    }

    .item {
      background: white;
      padding: 15px;
      border-radius: 10px;
      box-shadow: 0 2px 6px rgba(0,0,0,0.1);
    }

    button {
      background: #ff3d2e;
      color: white;
      border: none;
      padding: 10px;
      margin-top: 8px;
      border-radius: 8px;
      cursor: pointer;
      width: 100%;
    }

    button:hover {
      background: #e03225;
    }

    #cart {
      margin-top: 20px;
      font-size: 18px;
    }

    .checkout {
      margin-top: 15px;
      background: green;
    }
  </style>
</head>

<body>

<header>
  🍔 TheBurger
</header>

<div class="container">

  <h2>Menu</h2>

  <div class="menu">

    <div class="item">
      🍔 Classic Burger - $5
      <button onclick="addItem('Classic Burger')">Add</button>
    </div>

    <div class="item">
      🍟 Fries - $2
      <button onclick="addItem('Fries')">Add</button>
    </div>

    <div class="item">
      🥤 Soda - $1
      <button onclick="addItem('Soda')">Add</button>
    </div>

  </div>

  <div id="cart">
    🛒 Cart: <span id="cartItems">Empty</span>
  </div>

  <button class="checkout" onclick="checkout()">Checkout</button>

</div>

<script>
  let cart = [];

  function addItem(item) {
    cart.push(item);
    updateCart();
  }

  function updateCart() {
    if (cart.length === 0) {
      document.getElementById("cartItems").innerText = "Empty";
    } else {
      document.getElementById("cartItems").innerText = cart.join(", ");
    }
  }

  function checkout() {
    if (cart.length === 0) {
      alert("Your cart is empty!");
    } else {
      alert("Order placed: " + cart.join(", "));
      cart = [];
      updateCart();
    }
  }
</script>

</body>
</html>
